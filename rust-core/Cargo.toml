[package]
name = "imgtxd-core"
version = "0.1.0"
edition = "2021"
description = "ImgTxd Studio native core: archive parsers/builders, texture codecs, texdb (Rust rewrite, user decision 2026-10-23)"

[lib]
name = "imgtxd_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.17"
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
