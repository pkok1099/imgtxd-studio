name: Build Release APK

on:
  push:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the built APK to (optional)"
        required: false
        type: string

jobs:
  rust-core:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --manifest-path rust-core/Cargo.toml --check

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml

  build:
    name: Build & Sign APK
    needs: rust-core
    # On release events, only build in the public repo (the private repo has
    # no keystore secrets, so a signed release build cannot run there).
    if: ${{ github.event_name != 'release' || github.repository == 'pkok1099/imgtxd-studio' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/studio.keystore
            echo "Keystore restored successfully."
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/GTA_Img_Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA_Img_Studio
          path: output/GTA_Img_Studio.apk
          if-no-files-found: error

  attach-release:
    name: Attach APK to Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Public repo only, and only when there is a release to attach to:
    # a published release event, or a manual dispatch naming a release tag.
    if: ${{ github.repository == 'pkok1099/imgtxd-studio' && (github.event_name == 'release' || inputs.release_tag != '') }}

    steps:
      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTA_Img_Studio
          path: release-apk

      - name: Attach APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "Attaching GTA_Img_Studio.apk to release $TAG in ${{ github.repository }}"
          gh release upload "$TAG" release-apk/GTA_Img_Studio.apk --clobber --repo "${{ github.repository }}"
